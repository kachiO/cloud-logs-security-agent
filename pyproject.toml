[project]
name = "cloud-logs-security-agent"
version = "0.1.0"
description = "AI agent for cloud security incident response using reinforcement learning"
readme = "README.md"
authors = [
    { name = "kachio", email = "kachi.odoemene@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.34.0",
    "numpy>=2.2.6",
    "instructor>=1.8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
