[project]
name = "cloud-logs-security-agent"
version = "0.1.0"
description = "AI agent for cloud security incident response using reinforcement learning"
readme = "README.md"
authors = [
    { name = "kachio", email = "kachi.odoemene@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.34.0",
    "numpy>=2.2.6",
    "instructor[litellm]>=1.8.3",
    "litellm[caching]>=1.74.0",
    "tqdm>=4.67.1",
    "strands-agents>=0.2.1",
    "strands-agents-tools>=0.0.1",
    "anthropic>=0.57.1",
    "google-genai>=1.24.0",
    "datasets>=3.6.0",
    "matplotlib>=3.10.3",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "huggingface-hub>=0.33.2",
    "ipykernel>=6.29.5",
    "tiktoken>=0.9.0",
]
